<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F5F7"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-title" content="Tracking Gases">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Tracking Gases Semeato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&family=Outfit:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: faixa preta de marca + abas; painel em grade que vira coluna única no celular. */
:root{
  --red:#B7241F; --red-ink:#B7241F; --red-soft:#FBEDEC; --on-red:#FFFFFF;
  --bg:#FFFFFF; --fg:#151313; --muted:#6A6361; --line:#E6E1DF; --surface:#F6F4F3;
  --bar:#151313; --bar-fg:#FFFFFF; --ok:#5C5654;
  --g-glp:#D2701F; --g-o2:#23874F; --g-ar:#2C68B0; --g-n2:#5E6E82; --g-co2:#8C6A32; --g-mix:#16877A; --g-x:#7A716F;
  --f-display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red:#B7241F; --red-ink:#F0645D; --red-soft:#3A1614; --on-red:#FFFFFF;
  --bg:#121010; --fg:#F2EEED; --muted:#A39B99; --line:#2D2827; --surface:#1B1817;
  --bar:#0B0A0A; --bar-fg:#FFFFFF; --ok:#B5ADAB; --g-glp:#F09A4E; --g-o2:#4CC07E; --g-ar:#6FA4EC; --g-n2:#A4B2C4; --g-co2:#D2AE6E; --g-mix:#4CC4B4; --g-x:#A39B99; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#B7241F; --red-ink:#F0645D; --red-soft:#3A1614; --on-red:#FFFFFF;
  --bg:#121010; --fg:#F2EEED; --muted:#A39B99; --line:#2D2827; --surface:#1B1817;
  --bar:#0B0A0A; --bar-fg:#FFFFFF; --ok:#B5ADAB; --g-glp:#F09A4E; --g-o2:#4CC07E; --g-ar:#6FA4EC; --g-n2:#A4B2C4; --g-co2:#D2AE6E; --g-mix:#4CC4B4; --g-x:#A39B99; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);border-top:4px solid var(--red);box-shadow:0 6px 18px -10px rgba(0,0,0,.45)}
header.top > .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.plate{background:#fff;height:46px;padding:3px 5px;display:flex;align-items:center;flex:none}
.plate img{height:40px;width:auto;max-width:160px;object-fit:contain;display:block}
.plate .wm{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;color:#B7241F;line-height:1}
.brand .ttl{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .ttl b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.005em}
.brand .ttl span{font-size:11.5px;color:#BDB5B3;font-weight:500}
.fabsel{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#BDB5B3;letter-spacing:.06em;text-transform:uppercase}
.fabsel select{background:#0E0C0C;color:#fff;border:1px solid #4A4443;font-weight:600;padding:5px 8px;text-transform:none;letter-spacing:0}
.sync{font-size:12px;color:#BDB5B3}
@media (max-width:620px){
  .sync{font-size:0;width:10px;height:10px;border-radius:50%;background:#8A8280;flex:none}
  .sync::before{display:none}
  .sync[data-s=on]{background:#6BBF59}.sync[data-s=off]{background:#E5514B}
  .brand .ttl span{display:none}
  .brand .ttl b{font-size:15px;white-space:nowrap}
  .brand{gap:10px}
  .plate{height:38px;padding:2px 4px}.plate .wm{font-size:16px}.plate img{height:34px}
  .fabsel{font-size:0;gap:0}
  header.top > .wrap{flex-wrap:nowrap;padding-block:10px}
}
/* Foto da leitura */
.thumb{display:flex;gap:8px;align-items:center;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.thumb img{width:56px;height:56px;object-fit:cover;display:block}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini b{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.mini .alert b{color:var(--red-ink)}
nav.tabs{border-top:1px solid #2A2625;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap{display:flex;gap:2px;white-space:nowrap}
nav.tabs a{color:#D9D2D0;text-decoration:none;padding:10px 12px;font-weight:600;font-size:13px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:var(--on-red);font-size:11px;text-align:center}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:21px;font-weight:700;letter-spacing:-.025em}
main .sec + .sec,main .grid + .sec{margin-top:8px}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.mono{font-family:var(--f-mono);font-size:12.5px}
.mono .await{font-family:var(--f-body)}

.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.sec-h .sp{flex:1}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--bg)}

.btn{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer;border-radius:0;text-decoration:none;transition:background .15s ease,border-color .15s ease,transform .1s ease}
.btn:hover{background:var(--surface)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:12px}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px}}
::selection{background:var(--red);color:var(--on-red)}
input,textarea{caret-color:var(--red)}
input[type=checkbox]{accent-color:var(--red)}
html{scrollbar-color:var(--muted) var(--bg)}
a{color:var(--red-ink);text-underline-offset:3px}
.btn.ghost{border-color:var(--line)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
body.ro .w,body:not(.adm) .w{display:none!important}
body:not(.adm) .fabsel{display:none!important}

.await{color:var(--red-ink);font-weight:600;font-size:12px;white-space:nowrap}
.await::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.ex{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:1px 5px;border:1px dashed var(--muted);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill{display:inline-block;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--ok)}
.pill.bad{background:var(--red);border-color:var(--red);color:var(--on-red)}
.pill.warn{border-color:var(--red);color:var(--red-ink)}
.pill.open{border-color:var(--fg);color:var(--fg)}

.tw{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:0}
table.wide{min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
tr:last-child td{border-bottom:0}
tr.late td{background:var(--red-soft)}
td.act{white-space:nowrap;text-align:right}
.empty{padding:18px;border:1px dashed var(--line);color:var(--muted)}

/* Contrato */
.countdown{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big.alert{color:var(--red-ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;font-weight:600;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.step.on{background:var(--red);border-color:var(--red);color:var(--on-red)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);background:var(--surface)}
.banner.red{border-color:var(--red);background:var(--red-soft)}
.banner .sp{flex:1}
.alerts{align-items:flex-start}
.alerts ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;min-width:0}
.alerts li{display:flex;gap:8px;align-items:baseline}
.alerts li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none;transform:translateY(-1px)}

/* KPI */
.kpis{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--line)}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--red-ink)}

/* Tanques */
.tanks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.tank{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.tank.low{border-color:var(--red);background:linear-gradient(var(--red-soft),var(--red-soft)) top/100% 44px no-repeat}
.tank .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lvl{height:10px;background:var(--surface);border:1px solid var(--line);position:relative}
.lvl i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.tank.low .lvl i{background:var(--red)}
.lvl::after{content:"";position:absolute;left:30%;top:-3px;bottom:-3px;border-left:1px dashed var(--muted)}
.pct{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.tank.low .pct{color:var(--red-ink)}
dl.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.kv dd .await{white-space:normal}
@media (max-width:520px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dd{margin-bottom:6px}}

/* Barras */
.hbar{display:flex;align-items:center;gap:8px}
.hbar span{flex:1;height:8px;background:var(--surface);position:relative;min-width:60px}
.hbar span i{position:absolute;inset:0;background:var(--fg);transform-origin:left;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.hbar span i.bad{background:var(--red)}

/* Pendências */
.pend{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.pend:last-child{border-bottom:0}
.pend .t{flex:1;min-width:0}
.pend.done .t{color:var(--muted);text-decoration:line-through}
.pend .d{text-align:right;white-space:nowrap;font-size:12px}
.pend .d b{font-family:var(--f-display);font-size:18px;display:block;font-variant-numeric:tabular-nums}
.pend input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.list{border:1px solid var(--line)}

/* Formulários */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:7px 9px;border-radius:0;max-width:100%}
textarea{min-height:80px;resize:vertical}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);width:min(560px,100%);border-top:4px solid var(--red);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.modal form .full{grid-column:1/-1}
@media (max-width:520px){.modal form{grid-template-columns:1fr}.big{font-size:44px}.countdown{grid-template-columns:1fr}}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--fg);font-size:13px;border:1px solid var(--line);padding:5px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;font-weight:600;z-index:30}
.toast.err{background:var(--red);color:var(--on-red)}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
@media (prefers-reduced-motion:no-preference){
}
.brandset{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brandset .plate{height:auto;padding:8px;border:1px solid var(--line)}
.brandset .plate img{height:64px;max-width:240px}

/* Identidade de cada gás */
.gchip{--g:var(--g-x);display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;font-weight:600;font-size:12.5px;line-height:1.2;color:var(--fg);white-space:nowrap;
  background:color-mix(in oklab,var(--g) 12%,var(--bg));border:1px solid color-mix(in oklab,var(--g) 38%,var(--bg))}
.gchip svg{color:var(--g);flex:none}
.gchip.lg{font-size:14px;padding:5px 12px 5px 8px}
button.gchip{font:inherit;font-weight:600;font-size:13px;cursor:pointer;min-height:36px;transition:background .2s cubic-bezier(.16,1,.3,1),transform .1s ease}
button.gchip:active{transform:scale(.98)}
button.gchip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--bg)}
button.gchip[aria-pressed="true"] svg{color:var(--bg)}
.tank.low .cap .mark{stroke:var(--red);stroke-dasharray:none;stroke-width:1.4}
.gtabs{display:flex;gap:8px;flex-wrap:wrap}
.legend-g{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12.5px}
/* Tanque desenhado */
.tank{display:flex;flex-direction:column;gap:12px}
.tank .body{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center}
.cap .lv{transform-box:fill-box;transform-origin:50% 100%}
.cap .shell{fill:none;stroke:var(--fg);stroke-width:1.6}
.cap .mark{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.cap text{font:600 8px var(--f-body);fill:var(--muted)}
/* Distribuição do gasto */
.stack{display:flex;height:16px;overflow:hidden;background:var(--surface)}
.stack i{display:block;height:100%;background:var(--g);transform-origin:left}
.stack i + i{border-left:2px solid var(--bg)}
/* Esqueleto de carregamento */
.sk{background:linear-gradient(in oklch 90deg,var(--surface) 0%,color-mix(in oklab,var(--line) 70%,var(--surface)) 45%,var(--surface) 90%) 0 0/300% 100%;animation:shimmer 1.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes shimmer{to{background-position:-150% 0}}
.skel{display:grid;gap:16px}
.skel .row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
@media (prefers-reduced-motion:no-preference){
  .boot > *{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
  .boot > :nth-child(2){animation-delay:50ms}.boot > :nth-child(3){animation-delay:100ms}.boot > :nth-child(4){animation-delay:150ms}
  .boot > :nth-child(5){animation-delay:200ms}.boot > :nth-child(6){animation-delay:250ms}.boot > :nth-child(n+7){animation-delay:300ms}
  @keyframes rise{from{opacity:.001;transform:translateY(10px)}}
  .boot .cap .lv{animation:fillup 1.1s cubic-bezier(.16,1,.3,1) .2s both}
  @keyframes fillup{from{transform:scaleY(0)}}
  .boot .stack i{animation:grow .9s cubic-bezier(.16,1,.3,1) .2s both}
  @keyframes grow{from{transform:scaleX(0)}}
  .sync[data-s=on]::before{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35;transform:scale(.8)}}
}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8A8280;margin-right:7px;vertical-align:1px}
.sync[data-s=on]::before{background:#6BBF59}.sync[data-s=off]::before{background:#E5514B}
/* Fábricas em linhas */
.fabs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fab{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 0;border:0;border-bottom:1px solid var(--line)}
.fab .nm{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.04em}
.fab.alert .nm{color:var(--red-ink)}
.fab .usos{display:flex;flex-direction:column;gap:8px;min-width:0}
.uso{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0;border:0}
.uso span.ap{font-size:13px;color:var(--muted)}
.fab .side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
@media (max-width:720px){.fab{grid-template-columns:minmax(0,1fr);gap:12px}.fab .side{align-items:flex-start}}

/* ================= Camada Apple ================= */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E73; --line:#E3E3E8; --surface:#F0F0F3;
  --red:#B7241F; --red-ink:#B7241F; --red-soft:#FCEEED; --ok:#6E6E73; --bar:#F5F5F7;
  --hair:transparent; --r:18px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px -8px rgba(0,0,0,.08);
  --sh-lg:0 24px 60px -12px rgba(0,0,0,.28);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Geist","Segoe UI",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Geist","Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono","Geist Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

/* ---------- regras de negócio ---------- */
function slaPara(gasId, uniId){
  const fid = fornDeGas(gasId);
  let best = null, score = -1;
  for (const s of S.slas){
    if (s.fornecedorId && fid && s.fornecedorId !== fid) continue;
    const g = s.gasId || '', u = s.unidadeId || '';
    if (g && g !== gasId) continue;
    if (u && u !== uniId) continue;
    const sc = (g?2:0) + (u?1:0);
    if (sc > score){ score = sc; best = s; }
  }
  return best;
}
function avaliar(p){
  const sla = slaPara(p.gasId, p.unidadeId);
  const antecip = p.antecipado === 'sim';
  const entregue = !!p.dataEntrega;
  const fid = fornDeGas(p.gasId);
  let inicio, prazo, base;
  if (antecip){
    if (!p.dataConfPagamento) return {st:'pag', entregue, label:'Aguardando confirmação do pagamento'};
    inicio = p.dataConfPagamento; base = 'confirmação do pagamento';
    prazo = numOu(sla?.prazoPagamento) ?? numOu(sla?.prazoContrato);
  } else {
    inicio = p.data; base = 'pedido';
    prazo = numOu(sla?.prazoPedido) ?? numOu(sla?.prazoContrato);
  }
  const fim = p.dataEntrega || HOJE;
  const dias = Math.max(0, diff(inicio, fim));
  if (prazo === null) return {st:'semsla', entregue, dias, inicio, base, label:'Prazo: aguardando '+(fid ? nomeForn(fid) : 'fornecedor')};
  const atraso = dias - prazo, venc = addDias(inicio, prazo);
  if (entregue) return atraso > 0
    ? {st:'atrasado', entregue, dias, prazo, atraso, inicio, base, label:'Atrasado '+atraso+' '+plural(atraso,'dia','dias')}
    : {st:'noprazo', entregue, dias, prazo, atraso:0, inicio, base, label:'No prazo'};
  return atraso > 0
    ? {st:'abertoatrasado', entregue, dias, prazo, atraso, inicio, base, venc, label:'Em aberto · atrasado '+atraso+' '+plural(atraso,'dia','dias')}
    : {st:'aberto', entregue, dias, prazo, atraso:0, inicio, base, venc, label:'Em aberto · vence '+fdata(venc)};
}
const pillCls = st => ({atrasado:'bad',abertoatrasado:'bad',noprazo:'',aberto:'open',pag:'warn',semsla:'warn'})[st] ?? '';
const pill = a => '<span class="pill '+pillCls(a.st)+'">'+esc(a.label)+'</span>';
const isLate = a => a.st === 'atrasado' || a.st === 'abertoatrasado';

function contratoInfo(c){
  if (!c || !c.fimVigencia) return null;
  const restam = diff(HOJE, c.fimVigencia);
  const aviso = numOu(c.avisoDias);
  const limiteAviso = aviso !== null ? addDias(c.fimVigencia, -aviso) : null;
  const restamAviso = limiteAviso ? diff(HOJE, limiteAviso) : null;
  return {restam, limiteAviso, restamAviso, nivel: restam <= 30 ? 30 : restam <= 60 ? 60 : restam <= 90 ? 90 : 0};
}

function rotulo(col, r){
  if (col === 'contratos') return r.fornecedor || 'Contrato';
  if (col === 'gases') return r.nome || 'Gás sem nome';
  if (col === 'precos') return nomeGas(r.gasId) + (r.vigencia ? ' · vigência '+fdata(r.vigencia) : '');
  if (col === 'tanques') return (tqRot(r) || 'Sem código') + ' · ' + nomeGas(r.gasId) + ' · ' + nomeUni(r.unidadeId);
  if (col === 'slas') return (r.gasId ? nomeGas(r.gasId) : 'Todos os gases') + ' · ' + (r.unidadeId ? nomeUni(r.unidadeId) : 'todas as fábricas');
  if (col === 'usos') return nomeGas(r.gasId) + ' · ' + nomeUni(r.unidadeId) + ' · ' + (r.aplicacao||'');
  if (col === 'pedidos') return nomeGas(r.gasId) + ' · ' + nomeUni(r.unidadeId) + ' · ' + fdata(r.data);
  if (col === 'pendencias') return r.texto || '';
  if (col === 'creditos') return 'Crédito de '+brl(r.valor)+' · '+nomeForn(r.fornecedorId)+' · '+(CRED_MOT[r.motivo]||'');

/* ---------- LEITURA EM POLEGADAS (tanques criogênicos da White Martins) ---------- */

function pctDe(t, l){

/* ---------- CONSUMO ---------- */
const JANELA = 14;
function parseCap(txt){
  const m = String(txt||'').match(/([\d.,]+)\s*(kg|l\b|litros?|m3|m³)/i);
  if (!m) return null;
  const v = Number(m[1].replace(/\./g,'').replace(',','.'));
  if (!v) return null;
  const u = /kg/i.test(m[2]) ? 'kg' : /m/i.test(m[2]) ? 'm³' : 'L';
  return {v, u};
}
function consumo(t){
  const porDia = new Map();
  S.leituras.filter(l => l.tanqueId === t.id && l.data && !vazio(l.nivel)).forEach(l => porDia.set(l.data, Number(l.nivel)));
  if (t.ultimaLeitura && !vazio(t.nivel) && !porDia.has(t.ultimaLeitura)) porDia.set(t.ultimaLeitura, Number(t.nivel));
  const ls = [...porDia.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([data,nivel]) => ({data, nivel}));
  const iv = [];
  for (let i = 1; i < ls.length; i++){
    const a = ls[i-1], b = ls[i], dias = diff(a.data, b.data), queda = a.nivel - b.nivel;
    if (dias <= 0) continue;
    iv.push(queda < 0 ? {ini:a.data, fim:b.data, dias, abast:true, de:a.nivel, para:b.nivel} : {ini:a.data, fim:b.data, dias, queda, taxa:queda/dias});
  }
  const uso = iv.filter(x => !x.abast);
  const med = arr => { const d = arr.reduce((s,x) => s+x.dias, 0); return d ? arr.reduce((s,x) => s+x.queda, 0)/d : null; };
  const corte = addDias(HOJE, -JANELA);
  const rec = uso.filter(x => x.fim > corte), ant = uso.filter(x => x.fim <= corte);
  const media = med(uso), mediaRec = med(rec), mediaAnt = med(ant);
  const variacao = (mediaRec !== null && mediaAnt) ? (mediaRec/mediaAnt - 1)*100 : null;
  const ritmo = mediaRec ?? media, nivel = vazio(t.nivel) ? null : Number(t.nivel);

    for (const l of S.leituras) if (l.tanqueId === t.id && l.data && (!best || l.data > best.data || (l.data === best.data && l._op))) best = l;
    if (best && (!t.ultimaLeitura || best.data >= t.ultimaLeitura)) return {...t, nivel:best.nivel, nivelPol: vazio(best.nivelPol) ? '' : best.nivelPol, ultimaLeitura:best.data, fotoId:best.fotoId || t.fotoId};
    if (!vazio(t.nivelPol) && ehPol(t)){ const p = pctDe(t, t); return {...t, nivel: p === null ? '' : p}; }
    return t;
  });
}
function filaCentral(){
  const leit = S.itens.filter(i => i.tipo === 'leitura' && ['pendente','alterado'].includes(statusItem(i))).sort((a,b) => (a.criadoEm||'').localeCompare(b.criadoEm||''));
  const avisos = S.itens.filter(i => i.tipo === 'aviso' && statusItem(i) === 'pendente').sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));
  return {leit, avisos, total: ehAdm() || papel === 'adm' ? leit.length + avisos.length : 0};
}
async function enviarItem(dados, arq){
  if (foraDoHorario()) throw {code:'fechado'};
  if (bloqueioDesktop()) throw {code:'desktop'};
  if (!meuId) throw {code:'sem_id'};
  if (!assets) throw {code:'sem_foto'};
  if (!arq) throw {code:'foto_obrigatoria'};
  const c = await comprimir(arq);
  const up = await assets.upload(c.blob, {type:c.type});
  const agora = new Date().toISOString();
  await db.doc('registros/'+meuId).set({ultimoEnvio:agora});
  await db.collection('registros/'+meuId+'/itens').add({...dados, fotoId:up.id, criadoEm:agora, data:dados.data || HOJE, autor:meuId});
}
function erroEnvio(err){
  const c = err && err.code;
  if (c === 'desktop') toast('Envie pelo celular.', 1);
  else if (c === 'fechado') toast('O app está fora do horário de uso. Envie entre '+horarioCfg().inicio+' e '+horarioCfg().fim+'.', 1);
  else if (c === 'sem_id' || c === 'sem_foto') toast('Sua conta não pode enviar fotos neste app. Peça ao ADM acesso de Colaborador.', 1);
  else if (c === 'foto_obrigatoria') toast('A foto é obrigatória. Tire a foto antes de enviar.', 1);
  else if (c === 'invalid_argument') toast('Sua conta só pode ver o app. Peça ao ADM acesso de Colaborador para enviar.', 1);
  else if (c === 'quota_exceeded') toast('O espaço do app está cheio. Avise o ADM.', 1);
  else toast('Não foi possível enviar agora. Confira a conexão e tente de novo.', 1);
}
async function decidir(i, status, motivo){
  const em = new Date().toISOString();
  await db.collection('aprovacoes').doc(chaveAprov(i)).set({status, nivel: i.nivel ?? null, nivelPol: i.nivelPol ?? '', fotoId: i.fotoId || '', motivo: motivo || '', em, por: meuId || '', exemplo:false});
  if (status === 'aprovado' && i.tipo === 'leitura'){
    const t = S._tanques.find(x => x.id === i.tanqueId);
    if (t && (!t.ultimaLeitura || (i.data||'') >= t.ultimaLeitura)) await db.collection('tanques').doc(t.id).update({nivel:(p => p === null ? '' : p)(pctDe(t, i)), nivelPol: vazio(i.nivelPol) ? '' : Number(i.nivelPol), ultimaLeitura:i.data, fotoId:i.fotoId||''}).catch(() => {});
  }
  if (i._uid !== meuId) await db.doc('registros/'+i._uid+'/decisoes/'+i.id).set({status, nivel: i.nivel ?? null, fotoId: i.fotoId || '', motivo: motivo || '', em}).catch(() => {});
}
function nivelAnterior(i){
  let best = null;
  for (const l of S.leituras) if (l.tanqueId === i.tanqueId && l.data && l.data <= i.data && (!best || l.data > best.data)) best = l;
  return best;
}

/* ---------- PREVISÃO DE COMPRA (com ajuste de inverno) ---------- */
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
/* Ajuste padrão por mês: inverno do Sul (jun–ago) consome mais */
const SAZ_PADRAO = [0,0,0,0,0,10,10,10,0,0,0,0];
const ajustes = () => { const f = (byId('config','sazonal')||{}).ajustes; return Array.isArray(f) && f.length === 12 ? f.map(Number) : SAZ_PADRAO; };
const fatorMes = (iso, aj) => 1 + (aj || ajustes())[Number(iso.slice(5,7)) - 1]/100;
const INVERNO = [6,7,8];
const ehInverno = iso => INVERNO.includes(Number(iso.slice(5,7)));
const ALVO_ENCHER = 90, PRAZO_PADRAO = 3;
function prazoEntrega(t){
  const sla = slaPara(t.gasId, t.unidadeId);
  const v = numOu(sla?.prazoPedido) ?? numOu(sla?.prazoContrato);
  return v === null ? {dias:PRAZO_PADRAO, padrao:true} : {dias:v, padrao:false};
}
function projetar(nivel, ref, base, aj, sazonal){
  let L = nivel, d = ref, d30 = nivel <= 30 ? ref : null, d0 = null;
  const serie = [[ref, nivel]];
  for (let k = 0; k < 540 && L > 0; k++){
    d = addDias(d, 1);
    L -= base * (sazonal ? fatorMes(d, aj) : 1);
    serie.push([d, Math.max(0, L)]);
    if (d30 === null && L <= 30) d30 = d;
    if (L <= 0){ d0 = d; break; }
  }
  return {serie, d30, d0};
}
function previsao(t, c){

      const okPre = querPre ? (pre && pre.vigencia === p.data && pre.gasId === p.gasId && Math.abs(pre.preco - Number(p.valor)/Number(p.quantidade)) < 0.001) : !(pre && pre.origem === 'pedido');
      if (!okPag || !okPre) await sincronizarPedido(p.id, p);
    }
    for (const x of S.pagamentos.concat(S.precos)) if (x.origem === 'pedido' && x.pedidoId && !byId('pedidos', x.pedidoId)) await sincronizarPedido(x.pedidoId, null);

const notaDoPag = (p, notas) => (p.notaId && notas.some(n => n.id === p.notaId)) ? p.notaId : (p.pedidoId ? ((notas.find(n => n.pedidoId === p.pedidoId) || {}).id || '') : '');

let finForn = '';
const cent = v => Math.round((Number(v)||0)*100);
const real = c => c/100;
/* Ordem: data; no mesmo dia, nota antes do pagamento. Crédito = pago a mais (ou antecipado sem nota), descontado nas notas seguintes. */
function contaCorrente(fid){
  const notas = S.notas.filter(n => n.fornecedorId === fid).map(n => ({...n, _t:'nota', _d:n.emissao||''}));
  const pags = S.pagamentos.filter(p => p.fornecedorId === fid).map(p => ({...p, notaId: notaDoPag(p, notas)}));
  const avulsos = pags.filter(p => !p.notaId).map(p => ({...p, _t:'pag', _d:p.data||''}))
    .concat(S.creditos.filter(c => c.fornecedorId === fid).map(c => ({...c, _t:'pag', _d:c.data||'', _cred:true})));
  const evs = notas.concat(avulsos).sort((a,b) => a._d.localeCompare(b._d) || (a._t === 'nota' ? -1 : 1));
  let pool = 0; const linhas = []; const resNota = {};
  for (const e of evs){
    if (e._t === 'pag'){ pool += cent(e.valor); linhas.push({tipo:'pag', r:e, credito:pool}); continue; }
    const valor = cent(e.valor), aplicado = Math.min(pool, valor);
    pool -= aplicado;
    const liquido = valor - aplicado;
    const pgs = pags.filter(p => p.notaId === e.id).sort((a,b) => (a.data||'').localeCompare(b.data||''));
    const pago = pgs.reduce((s,p) => s + cent(p.valor), 0);
    const dif = pago - liquido;
    if (dif > 0) pool += dif;
    const st = pago === 0 ? (liquido === 0 ? 'quitada' : 'aberta') : dif === 0 ? 'quitada' : dif > 0 ? 'credito' : 'parcial';
    const res = {valor, aplicado, liquido, pago, dif, st, pgs, creditoApos: pool};
    resNota[e.id] = res;
    linhas.push({tipo:'nota', r:e, ...res});
  }
  /* Crédito que sobrou abate notas ainda em aberto (da mais antiga para a mais nova) */
  for (const l of linhas){
    if (l.tipo !== 'nota' || pool <= 0) continue;
    const falta = l.liquido - l.pago;
    if (falta <= 0) continue;
    const usa = Math.min(pool, falta);
    l.aplicado += usa; l.liquido -= usa; pool -= usa; l.dif = l.pago - l.liquido;
    l.st = l.dif === 0 ? 'quitada' : l.pago === 0 ? 'aberta' : 'parcial';
    if (l.liquido === 0 && l.pago === 0) l.st = 'quitada';
    Object.assign(resNota[l.r.id], {aplicado:l.aplicado, liquido:l.liquido, dif:l.dif, st:l.st});
  }
  const abertas = linhas.filter(l => l.tipo === 'nota' && (l.st === 'aberta' || l.st === 'parcial'));
  const emAberto = abertas.reduce((s,l) => s + (l.liquido - l.pago), 0);
  const ultima = linhas.filter(l => l.tipo === 'nota').pop() || null;
  return {linhas, credito: pool, emAberto, abertas, ultima, resNota};
}

const DIAS_FOTO = 45;
const corteFotos = () => addDias(HOJE, -DIAS_FOTO);

let limpandoFotos = false;
async function limparFotos(){
  if (papel !== 'adm' || !assets || !db || limpandoFotos || loaded.size < COLS.length || !regLoaded) return;
  const corte = corteFotos(), cfg = byId('config','limpeza') || {};
  if (cfg.ate === corte) return;
  limpandoFotos = true;
  const desde = cfg.ate || '';
  const ids = new Set();
  /* fotos de leitura, avisos, notas, comprovantes e créditos; os dados (valores, níveis, créditos) ficam. Contrato (PDF) e logo não são apagados. */
  S._leituras.forEach(l => { if (l.fotoId && l.data && l.data < corte && l.data >= desde) ids.add(l.fotoId); });
  S.itens.forEach(i => { const d = i.data || (i.criadoEm||'').slice(0,10); if (i.fotoId && d && d < corte && d >= desde) ids.add(i.fotoId); });
  const velho = d => d && d < corte && d >= desde;
  S.notas.forEach(n => { if (n.fotoId && velho(n.emissao)) ids.add(n.fotoId); });
  S.pagamentos.forEach(x => { if (x.fotoId && velho(x.data)) ids.add(x.fotoId); });
  S.creditos.forEach(x => { if (x.fotoId && velho(x.data)) ids.add(x.fotoId); });
  const protegidos = new Set([].concat(...S.contratos.map(c => (c.anexos||[]).map(a => a.id)), ((byId('config','marca')||{}).logoId) || []).filter(Boolean));
  let n = 0;
  for (const id of ids){ if (protegidos.has(id)) continue; try { await assets.delete(id); n++; } catch(_){} }
  try { await db.collection('config').doc('limpeza').set({ate:corte, apagadas:(cfg.apagadas||0)+n, em:new Date().toISOString(), exemplo:false}); } catch(_){}
  limpandoFotos = false;
}

/* ---------- CONFERÊNCIA DOS ABASTECIMENTOS (perda por resfriamento) ---------- */
/* Tanque criogênico gasta parte do gás para resfriar no abastecimento: o faturado costuma ser maior que o que sobe no tanque. */
const criogenico = gid => ['o2','snow','atom'].includes(gasVis(byId('gases', gid)).ic);
const TOL_MEDICAO = 3;
const perdaGas = gid => { const g = byId('gases', gid); const v = g ? numOu(g.perdaResfriamento) : null; return v !== null ? v : (criogenico(gid) ? 10 : 2); };
/* m³ de gás por litro de líquido (aproximado, 1 atm ~15 °C) */
const M3_POR_LITRO = {o2:0.86, snow:0.69, atom:0.84};
function emMedida(qtd, capU, gid){
  const g = byId('gases', gid) || {}, med = g.medida || '';
  const alvo = med === 'm3' ? 'm³' : med;
  if (!med || alvo === capU) return {v:qtd, u: alvo || capU, aprox:false};
  if (capU === 'L' && med === 'm3'){ const f = M3_POR_LITRO[gasVis(g).ic]; if (f) return {v:qtd*f, u:'m³', aprox:true}; }
  return null;
}
function conferencias(){
  const out = [];
  S.tanques.filter(fabOk).forEach(t => {
    const c = consumo(t);
    c.iv.filter(x => x.abast).forEach(r => {
      const delta = r.para - r.de, tol = perdaGas(t.gasId);
      const bruto = c.cap ? delta/100*c.cap.v : null;
      const rec = bruto !== null ? emMedida(bruto, c.cap.u, t.gasId) : null;
      const ini = addDias(r.ini, -1), fim = addDias(r.fim, 2);
      const peds = S.pedidos.filter(p => p.gasId === t.gasId && p.unidadeId === t.unidadeId && (p.dataEntrega || p.data) >= ini && (p.dataEntrega || p.data) <= fim)
        .sort((a,b) => Math.abs(diff(a.dataEntrega||a.data, r.fim)) - Math.abs(diff(b.dataEntrega||b.data, r.fim)));
      const p = peds[0] || null, fr = fracTanque(t), fat = p && !vazio(p.quantidade) ? Number(p.quantidade)*fr : null;
      let st, dif = null;
      const chave = t.id+'~'+r.fim, dec = byId('conferencias', chave);
      if (!p) st = 'sempedido';
      else if (fat === null) st = 'semqtd';
      else if (!rec) st = c.cap ? 'unidade' : 'semcap';
      else {
        dif = (fat - rec.v)/fat*100;
        st = dif <= TOL_MEDICAO ? 'ok' : !dec ? 'verificar' : dec.motivo === 'resfriamento' ? (dif > tol ? 'resfalto' : 'resfriamento') : 'fornecedor';
      }
      out.push({t, r, delta, tol, rec, p, fat, dif, st, chave});
    });
  });
  return out.sort((a,b) => b.r.fim.localeCompare(a.r.fim));
}

      {h:'Faltou no tanque', n:1, f:x => x.dif === null ? '—' : x.dif <= 0 ? '<span class="muted">nada</span>' : '<b'+(x.st==='fornecedor'||x.st==='verificar'?' style="color:var(--red-ink)"':'')+'>'+nf(x.dif,1)+'%</b>'+(x.rec && x.fat ? '<div class="muted" style="font-size:12px">'+nf(x.fat - x.rec.v)+' '+esc(x.rec.u)+'</div>' : '')},
      {h:'Situação', f:x => '<span class="pill '+CONF_TXT[x.st][1]+'">'+CONF_TXT[x.st][0]+'</span>'+(x.st==='resfalto' ? '<div class="muted" style="font-size:12px">usual até '+nf(x.tol)+'%</div>' : '')+(x.st==='fornecedor' && byId('conferencias', x.chave) ? '<div style="font-size:12px;color:var(--ok-ink)">'+brl(byId('conferencias', x.chave).credito)+' na conta corrente acima</div>' : '')},
      {h:'', act:1, f:x => ['verificar','resfriamento','resfalto','fornecedor'].includes(x.st) ? '<span class="w">'+(x.st!=='resfriamento'&&x.st!=='resfalto' ? '<button class="btn sm" data-act="conf" data-id="'+esc(x.chave)+'" data-m="resfriamento">Foi resfriamento</button>' : '')+(x.st!=='fornecedor' ? '<button class="btn sm ghost" data-act="confcred" data-id="'+esc(x.chave)+'">Entregou menos: gerar crédito</button>' : '')+(x.st!=='verificar' ? '<button class="btn sm ghost" data-act="conf" data-id="'+esc(x.chave)+'" data-m="">Desfazer</button>' : '')+'</span>' : ''},
    ], lista, x => x.st === 'fornecedor' || x.st === 'verificar' ? 'late' : '')+
    '<p class="muted" style="margin:0;font-size:12.5px">A perda por resfriamento só acontece de vez em quando, por isso cada caso é marcado por você. Se marcar "foi resfriamento" numa diferença maior que o usual do gás (10% em oxigênio, nitrogênio e argônio; 2% no GLP), o app avisa. Para mudar esse limite, edite o gás em Contratos e cadastros.</p></section>';
}


/* ---------- CRÉDITOS (produto entregue a menos, desconto etc.) ---------- */
const CRED_MOT = {produto:'Entregou menos produto que o pago', desconto:'Desconto do fornecedor', devolucao:'Devolução', outro:'Outro'};
function precoUnit(p){ return p && !vazio(p.valor) && Number(p.quantidade) > 0 ? Number(p.valor)/Number(p.quantidade) : null; }
function abrirCredito(id, conf){
  const r = id ? {...byId('creditos', id)} : conf ? {fornecedorId: fornDeGas(conf.t.gasId), data: HOJE, motivo:'produto', pedidoId: conf.p ? conf.p.id : '', qtdFaltou: conf.rec ? Math.round(conf.fat - conf.rec.v) : '', unidade: conf.rec ? conf.rec.u : '', valor:'', origem:'conferencia'} : {fornecedorId: finForn, data: HOJE, motivo:'produto', origem:'manual'};
  if (id && !byId('creditos', id)) return;
  const pu = conf ? precoUnit(conf.p) : null;
  if (conf && pu && r.qtdFaltou) r.valor = Math.round(r.qtdFaltou * pu * 100)/100;
  const fOpts = ordenar('contratos',S.contratos).map(c => '<option value="'+c.id+'"'+(r.fornecedorId===c.id?' selected':'')+'>'+esc(c.fornecedor)+'</option>').join('');
  const pedOpts = fid => S.pedidos.filter(p => fornDeGas(p.gasId) === fid).sort((a,b) => (b.data||'').localeCompare(a.data||'')).slice(0,40).map(p => '<option value="'+p.id+'"'+(r.pedidoId===p.id?' selected':'')+'>'+fdata(p.data)+' · '+esc(nomeGas(p.gasId))+' '+esc(nomeUni(p.unidadeId))+(vazio(p.quantidade)?'':' · '+nf(p.quantidade)+' '+esc(medidaTxt((byId('gases',p.gasId)||{}).medida)))+(vazio(p.valor)?'':' · '+brl(p.valor))+'</option>').join('');
  abrirModal('<h2>'+(conf ? 'Gerar crédito por produto a menos' : (id ? 'Editar crédito' : 'Lançar crédito'))+'</h2>'+
    (conf ? '<div class="avs2">Faturado <b>'+nf(conf.fat)+' '+esc(conf.rec.u)+'</b> · entrou no tanque <b>~'+nf(conf.rec.v)+' '+esc(conf.rec.u)+'</b> · faltaram <b>'+nf(conf.fat-conf.rec.v)+' '+esc(conf.rec.u)+'</b>'+(pu ? ' × '+brl(pu)+' por '+esc(conf.rec.u)+' (preço do pedido) = <b>'+brl((conf.fat-conf.rec.v)*pu)+'</b>' : '. O pedido não tem valor e quantidade para calcular o preço: informe o valor do crédito.')+'</div>' : '')+
    '<form id="fcr" class="ffin" novalidate>'+
    '<label class="f">Fornecedor *<select id="cr_f" required>'+fOpts+'</select></label>'+
    '<label class="f">Data *<input id="cr_d" type="date" required value="'+esc(r.data||HOJE)+'"></label>'+
    '<label class="f">Motivo *<select id="cr_m">'+Object.entries(CRED_MOT).map(([k,l]) => '<option value="'+k+'"'+(r.motivo===k?' selected':'')+'>'+l+'</option>').join('')+'</select></label>'+
    '<label class="f">Valor do crédito (R$) *<input id="cr_v" type="number" step="0.01" min="0.01" required value="'+esc(r.valor??'')+'"></label>'+
    '<label class="f full">Pedido (opcional)<select id="cr_p"><option value="">Nenhum</option>'+pedOpts(r.fornecedorId)+'</select></label>'+
    '<label class="f">Quantidade que faltou (opcional)<input id="cr_q" type="number" step="any" min="0" value="'+esc(r.qtdFaltou??'')+'"></label>'+
    '<label class="f">Observação<input id="cr_o" value="'+esc(r.obs||'')+'"></label>'+
    '<div class="f full"><span>Documento (opcional)</span><label class="btn fotobtn" for="cr_a">'+CAM+(r.fotoId?'Trocar arquivo':'Foto ou PDF')+'</label><input type="file" id="cr_a" accept="image/*,application/pdf" hidden><span id="cr_an" class="muted" style="font-size:12.5px"></span></div>'+
    '<div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri">'+(conf ? 'Gerar crédito' : 'Salvar crédito')+'</button></div></form>', ov => {
    const q = x => ov.querySelector(x); let arq = null;
    q('#cr_a').addEventListener('change', e => { arq = e.target.files[0] || null; q('#cr_an').textContent = arq ? arq.name : ''; });
    q('#cr_f').addEventListener('change', () => { q('#cr_p').innerHTML = '<option value="">Nenhum</option>'+pedOpts(q('#cr_f').value); });
    q('#fcr').addEventListener('submit', async ev => {
      ev.preventDefault(); const f = ev.target; if (!f.checkValidity()){ f.reportValidity(); return; }
      const btn = f.querySelector('button.pri'); btn.disabled = true;
      try {
        const fotoId = arq ? await subirArquivo(arq) : (r.fotoId || '');
        const body = {fornecedorId:q('#cr_f').value, data:q('#cr_d').value, motivo:q('#cr_m').value, valor:Number(q('#cr_v').value), pedidoId:q('#cr_p').value, qtdFaltou: q('#cr_q').value === '' ? '' : Number(q('#cr_q').value), unidade: r.unidade || '', obs:q('#cr_o').value.trim(), fotoId, origem: r.origem || 'manual', exemplo:false};
        if (conf){
          await db.collection('creditos').doc('conf~'+conf.chave.replace(/[^\w~.-]/g,'_')).set({...body, conferencia:conf.chave});
          await db.collection('conferencias').doc(conf.chave).set({motivo:'fornecedor', credito:body.valor, em:new Date().toISOString(), exemplo:false});
        } else if (id) await db.collection('creditos').doc(id).set(body);
        else await db.collection('creditos').add(body);
        finForn = body.fornecedorId;
        fecharModal(); toast('Crédito de '+brl(body.valor)+' lançado para '+nomeForn(body.fornecedorId)+'. Será descontado na próxima nota.');
      } catch(err){ btn.disabled = false; erroDb(err); }
    });
  });
}

/* ---------- PREÇOS ---------- */
function vigentes(){
  const m = new Map();
  S.precos.filter(p => p.vigencia && p.vigencia <= HOJE && !vazio(p.preco)).forEach(p => {
    const k = p.gasId+'|'+p.medida, o = m.get(k);
    if (!o || p.vigencia > o.vigencia) m.set(k, p);
  });
  return new Set([...m.values()].map(p => p.id));
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function grafico(gasId){
  const fid = fornDeGas(gasId);
  const pts = S.precos.filter(p => p.gasId === gasId && p.vigencia && !vazio(p.preco)).sort((a,b) => a.vigencia.localeCompare(b.vigencia));
  if (!pts.length) return '<div class="empty">Sem preços com valor para este gás. '+AW(fid)+'</div>';
  const series = {};
  pts.forEach(p => (series[p.medida||'?'] ||= []).push(p));
  const W = 720, H = 260, L = 64, R = 34, T = 16, B = 34;
  const x0 = dnum(pts[0].vigencia), x1 = Math.max(dnum(HOJE), dnum(pts[pts.length-1].vigencia)) + 1;
  const ymax = Math.max(...pts.map(p => Number(p.preco))) * 1.15 || 1;
  const step = niceStep(ymax/4), ytop = step*Math.ceil(ymax/step);
  const X = d => L + (dnum(d) - x0) / Math.max(1, x1 - x0) * (W - L - R);
  const Y = v => T + (1 - v / ytop) * (H - T - B);
  const cores = [corGas(gasId),'var(--fg)','var(--muted)'];
  let g = '';
  for (let v = 0; v <= ytop + 1e-9; v += step){
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v.toLocaleString('pt-BR',{maximumFractionDigits:2})+'</text>';
  }
  const datas = [...new Set(pts.map(p => p.vigencia))];
  const mostrar = datas.length <= 5 ? datas : [datas[0], datas[Math.floor(datas.length/2)], datas[datas.length-1]];
  mostrar.forEach((d,i) => { g += '<text x="'+X(d)+'" y="'+(H-12)+'" text-anchor="'+(i===0?'start':'middle')+'">'+fdata(d).slice(3)+'</text>'; });
  g += '<text x="'+(W-R+30)+'" y="'+(H-12)+'" text-anchor="end">hoje</text>';
  Object.entries(series).forEach(([med, arr], i) => {
    const cor = cores[i % cores.length];
    let d = '';
    arr.forEach((p,j) => { const x = X(p.vigencia), y = Y(Number(p.preco)); d += (j ? ' H'+x+' V'+y : 'M'+x+' '+y); });
    d += ' H'+X(addDias(HOJE,1));
    g += '<path d="'+d+' V'+Y(0)+' H'+X(arr[0].vigencia)+' Z" fill="'+cor+'" opacity=".09"/>';
    g += '<path d="'+d+'" fill="none" stroke="'+cor+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    arr.forEach((p,j) => {
      const last = j === arr.length-1;
      g += '<circle cx="'+X(p.vigencia)+'" cy="'+Y(Number(p.preco))+'" r="'+(last?5:3.5)+'" fill="'+(last?cor:'var(--bg)')+'" stroke="'+cor+'" stroke-width="2"><title>'+fdata(p.vigencia)+': '+brl(p.preco)+'/'+medidaTxt(p.medida)+'</title></circle>';
    });
  });
  const legenda = Object.entries(series).map(([med, arr], i) => {
    const a = Number(arr[0].preco), b = Number(arr[arr.length-1].preco), pr = arr.length > 1 ? Number(arr[arr.length-2].preco) : null;
    const var1 = pr ? ((b/pr-1)*100) : null, varT = a ? ((b/a-1)*100) : null;
    return '<span><i style="background:'+cores[i%cores.length]+'"></i>R$ / '+esc(medidaTxt(med))+': <b>'+brl(b)+'</b>'+
      (var1 !== null ? ' · último reajuste <b class="num">'+(var1>=0?'+':'')+nf(var1,1)+'%</b> · desde '+fdata(arr[0].vigencia)+' <b class="num">'+(varT>=0?'+':'')+nf(varT,1)+'%</b>' : ' · preço único registrado')+'</span>';
  }).join('');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Variação de preço de '+esc(nomeGas(gasId))+'">'+g+'</svg></div><div class="legend">'+legenda+'</div>';
}
function vPrecos(){
  const gases = ordenar('gases', S.gases);

  const vig = vigentes();
  const rows = S.precos.slice().sort((a,b) => nomeGas(a.gasId).localeCompare(nomeGas(b.gasId),'pt-BR') || (b.vigencia||'').localeCompare(a.vigencia||''));

    {h:'', f:r => vig.has(r.id) ? '<span class="pill open">Vigente</span>' : r.vigencia > HOJE ? '<span class="pill">Futuro</span>' : '<span class="muted">Histórico</span>'},
    {h:'', act:1, f:r => acoes('precos',r)},
  ], rows) : vazioMsg('Tabela de preços: aguardando os fornecedores.','precos');
  return '<section class="sec"><div class="sec-h"><h2>Variação de preço</h2><span class="sp"></span>'+
    (gases.length ? '<div class="gtabs" role="group" aria-label="Gás do gráfico">'+gases.map(g => { const v = gasVis(g); return '<button class="gchip" style="--g:'+v.cor+'" data-act="gg" data-id="'+g.id+'" aria-pressed="'+(g.id===gasGrafico)+'">'+svgIc(v.ic,15)+esc(g.nome)+'</button>'; }).join('')+'</div>' : '')+'</div>'+
    '<div class="panel">'+(gasGrafico ? grafico(gasGrafico) : '<div class="empty">Cadastre os gases para ver o gráfico.</div>')+'</div></section>'+
    '<section class="sec"><div class="sec-h"><div><h2>Tabela de preços</h2><p class="muted" style="margin:4px 0 0">Um preço novo entra com nova data de vigência e o anterior fica no histórico. Cada pedido com valor e quantidade lança aqui o preço por unidade automaticamente.</p></div><span class="sp"></span><div class="tools"><button class="btn" data-act="csv" data-what="precos">Exportar CSV</button><button class="btn pri w" data-act="new" data-col="precos">Novo preço</button></div></div>'+tbl+'</section>';
}

/* ---------- INDICADORES ---------- */
function vIndicadores(){
  const av = S.pedidos.filter(fabOk).map(p => ({p, a:avaliar(p)})).filter(x => x.a.st === 'noprazo' || x.a.st === 'atrasado');
  const calc = arr => {
    const n = arr.length, ok = arr.filter(x => x.a.st === 'noprazo').length, late = arr.filter(x => x.a.st === 'atrasado');
    return {n, ok, pct: n ? ok/n*100 : null, atrasoMedio: late.length ? late.reduce((s,x) => s+x.a.atraso, 0)/late.length : 0, late:late.length};
  };
  const tot = calc(av);
  const grupo = (keyFn, nomeFn, titulo) => {
    const m = new Map(); av.forEach(x => { const k = keyFn(x.p); (m.get(k) || m.set(k,[]).get(k)).push(x); });
    const rows = [...m.entries()].map(([k,arr]) => ({k, ...calc(arr)})).sort((a,b) => a.pct - b.pct);
    if (!rows.length) return '<div class="empty">Sem entregas concluídas com prazo definido.</div>';
    return tabela([
      {h:titulo, f:r => rot(nomeFn, r.k)},
      {h:'Entregas', n:1, f:r => r.n},
      {h:'% no prazo', f:r => '<div class="hbar"><b class="num" style="min-width:44px">'+nf(r.pct)+'%</b><span><i class="'+(r.pct<90?'bad':'')+'" style="transform:scaleX('+(r.pct/100)+')"></i></span></div>'},
      {h:'Atraso médio', n:1, f:r => r.late ? '<b style="color:var(--red-ink)">'+nf(r.atrasoMedio,1)+' d</b>' : '<span class="muted">0 d</span>'},
    ], rows);
  };
  return '<section class="sec"><h2>Indicadores dos fornecedores'+fabTag()+'</h2><p class="muted" style="margin:0">Somente pedidos entregues com prazo contratual definido. O atraso médio considera os pedidos entregues fora do prazo.</p>'+
    '<div class="kpis"><div class="kpi"><span class="eyebrow">Entregas avaliadas</span><b>'+tot.n+'</b></div>'+
    '<div class="kpi'+(tot.pct!==null&&tot.pct<90?' alert':'')+'"><span class="eyebrow">% no prazo</span><b>'+(tot.pct===null?'—':nf(tot.pct)+'%')+'</b></div>'+
    '<div class="kpi'+(tot.late?' alert':'')+'"><span class="eyebrow">Entregas atrasadas</span><b>'+tot.late+'</b></div>'+

/* ---------- modal ---------- */
function abrirModal(html, onMount){
  const root = $('#modal-root');
  root.innerHTML = '<div class="ov" role="dialog" aria-modal="true"><div class="modal">'+html+'</div></div>';
  const ov = root.firstChild;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) fecharModal(); });
  onMount && onMount(ov);
  const f = ov.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea,button.pri'); f && f.focus();
}
function fecharModal(){ $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
function toast(msg, err){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2400);
}
function erroDb(e){
  const code = e && e.code;
  if (code === 'invalid_argument') { toast('Você não tem permissão para alterar os dados. Peça acesso de Colaborador ou Editor.', 1); document.body.classList.add('ro'); }
  else if (code === 'quota_exceeded') toast('O banco de dados está cheio. Apague registros antigos ou de exemplo.', 1);
  else toast('Não foi possível salvar agora. Tente de novo em instantes.', 1);
}

function campoHtml(f, v){
  const id = 'f_'+f.k, req = f.req ? ' required' : '';
  const lab = esc(f.l)+(f.req?' *':'')+(f.copa?' <span class="muted" style="font-weight:400">(fornecedor)</span>':'');
  const cls = 'f'+(f.full || f.t==='textarea' ? ' full' : '');
  if (f.t === 'textarea') return '<label class="'+cls+'">'+lab+'<textarea id="'+id+'" name="'+f.k+'"'+req+'>'+esc(v)+'</textarea></label>';
  if (f.t === 'select') return '<label class="'+cls+'">'+lab+'<select id="'+id+'" name="'+f.k+'"'+req+'><option value="">'+(f.copa?'Aguardando fornecedor':'—')+'</option>'+f.opts.map(o => '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>';
  if (f.t === 'ref') return '<label class="'+cls+'">'+lab+'<select id="'+id+'" name="'+f.k+'"'+req+'><option value="">'+(f.any||'Selecione…')+'</option>'+ordenar(f.ref, S[f.ref]).map(o => '<option value="'+o.id+'"'+(v===o.id?' selected':'')+'>'+esc(lbl(f.ref,o))+(f.ref==='gases'?' · '+esc(nomeForn(o.fornecedorId)):'')+(o.exemplo?' (EXEMPLO)':'')+'</option>').join('')+'</select></label>';
  const type = f.t === 'number' ? 'number" step="any' : f.t;
  return '<label class="'+cls+'">'+lab+'<input id="'+id+'" name="'+f.k+'" type="'+type+'" value="'+esc(v)+'"'+req+(f.copa?' placeholder="Aguardando fornecedor"':'')+'></label>';
}
function padroes(col){
  const primeiro = ordenar('contratos', S.contratos)[0];
  if (col === 'pedidos') return {data:HOJE, antecipado:'nao', unidadeId:fab};
  if (col === 'precos') return {vigencia:HOJE};
  if (col === 'tanques') return {ultimaLeitura:HOJE, unidadeId:fab};
  if (col === 'usos') return {unidadeId:fab};
  if (col === 'pendencias') return {fornecedorId:primeiro?.id||'', dataSolicitacao:primeiro?.dataEmail || HOJE, resolvido:false};
  return {};
}
function abrirForm(col, id){
  const sch = SCHEMA[col];
  if (id && !byId(col,id)) return;
  const rec = id ? {...byId(col,id)} : padroes(col);
  const titulo = (id ? 'Editar ' : 'Novo registro: ')+sch.titulo.toLowerCase()+(col==='contratos' && id ? ' · '+rec.fornecedor : '');
  const exemplo = '<label class="f full" style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" name="exemplo"'+(rec.exemplo?' checked':'')+'> Marcar como EXEMPLO</label>';
  abrirModal('<h2>'+esc(titulo)+'</h2><p class="muted" style="margin:0">Campos marcados "(fornecedor)" podem ficar vazios e entram na lista de pendências.</p><form id="frm" novalidate>'+
    sch.campos.map(f => campoHtml(f, rec[f.k] ?? '')).join('')+exemplo+
    '<div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn pri">Salvar</button></div></form>', ov => {
    const frm = ov.querySelector('#frm');
    const gasSel = frm.querySelector('[name=gasId]'), medSel = frm.querySelector('select[name=medida]');
    if (gasSel && medSel && col === 'precos') gasSel.addEventListener('change', () => { const g = byId('gases', gasSel.value); if (g && g.medida && !medSel.value) medSel.value = g.medida; });
    const fSel = frm.querySelector('[name=fornecedorId]'), dSol = frm.querySelector('[name=dataSolicitacao]');
    if (col === 'pendencias' && fSel && dSol) fSel.addEventListener('change', () => { const c = byId('contratos', fSel.value); if (c && c.dataEmail) dSol.value = c.dataEmail; });
    frm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!frm.checkValidity()){ frm.reportValidity(); return; }
      const body = {...rec};
      delete body.id;
      sch.campos.forEach(f => { const el = frm.elements[f.k]; let v = el.value.trim(); if (f.t === 'number' && v !== '') v = Number(v); body[f.k] = v; });
      if (col === 'tanques' && body.nivel !== '' && (body.nivel < 0 || body.nivel > 100)){ toast('O nível deve ficar entre 0 e 100%.', 1); return; }
      body.exemplo = !!frm.elements.exemplo.checked;
      const btn = frm.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Salvando…';
      try {
        let novoId = id;
        if (id) await db.collection(col).doc(id).set(body);
        else novoId = (await db.collection(col).add(body)).id;
        if (col === 'pedidos' && novoId){
          await sincronizarPedido(novoId, body).catch(erroDb);
          const lanc = [dataPagPedido(body) && !vazio(body.valor) ? 'pagamento' : '', !vazio(body.valor) && Number(body.quantidade) > 0 ? 'preço' : ''].filter(Boolean);
          fecharModal(); toast(lanc.length ? 'Pedido salvo · '+lanc.join(' e ')+' lançado'+(lanc.length > 1 ? 's' : '') : 'Salvo'); return;
        }
        fecharModal(); toast('Salvo');
      } catch(err){ btn.disabled = false; btn.textContent = 'Salvar'; erroDb(err); }
    });
  });
}
function confirmar(msg, acao, rotuloBtn){
  abrirModal('<h2>Confirmar</h2><p style="margin:0">'+msg+'</p><div class="tools" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" id="okc">'+(rotuloBtn||'Excluir')+'</button></div>', ov => {
    ov.querySelector('#okc').addEventListener('click', async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Aguarde…';
      try { await acao(); fecharModal(); } catch(err){ fecharModal(); erroDb(err); }
    });
  });
}

/* ---------- CSV ---------- */
const csvCel = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const csvNum = v => vazio(v) ? '' : String(v).replace('.',',');
function csvPedidos(){
  const h = ['Data do pedido','Fornecedor','Gás','Código do gás','Fábrica','Quantidade','Medida','Pagamento antecipado','Confirmação do pagamento','Entrega real','Prazo (dias)','Dias de atendimento','Contado a partir de','Situação','Atraso (dias)','Valor (R$)','Nota fiscal','Exemplo'];
  const rows = S.pedidos.filter(fabOk).sort((a,b) => (a.data||'').localeCompare(b.data||'')).map(p => {
    const a = avaliar(p), g = byId('gases',p.gasId);
    return [fdata(p.data), nomeForn(g?.fornecedorId), nomeGas(p.gasId), g?.codigo||'', nomeUni(p.unidadeId), csvNum(p.quantidade), medidaTxt(g?.medida), p.antecipado==='sim'?'Sim':'Não', fdata(p.dataConfPagamento), fdata(p.dataEntrega), a.prazo ?? '', a.dias ?? '', a.base||'', a.label, a.atraso||'', csvNum(p.valor), p.nf||'', p.exemplo?'EXEMPLO':''];
  });
  return [h].concat(rows).map(r => r.map(csvCel).join(';')).join('\r\n');
}
function csvPrecos(){

async function comprimir(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob ? {blob, type:'image/jpeg'} : {blob:file, type:file.type||'image/jpeg'};
  } catch(_) { return {blob:file, type:file.type||'image/jpeg'}; }
}

  window.claude.use('downloads').then(d => { downloads = d; });
  const u = await window.claude.use('user');
  userCap = u;
  let adm = false;
  if (u){ try { meuId = await u.id(); } catch(_){} try { adm = await u.canEdit(); } catch(_){} try { souDono = await u.isOwner(); } catch(_){} try { meuEmail = ((await u.email()) || '').toLowerCase(); } catch(_){} }
  papel = adm ? 'adm' : 'op';
  if (!adm) verComoOp = false;
  if (adm) iniciarAdm(); else iniciarOp();
  render();
}
function marcarAoVivo(){ $('#sync').textContent = 'Dados compartilhados · ao vivo'; $('#sync').dataset.s = 'on'; }
function iniciarAdm(){
  const subsItens = new Map(), itensPor = new Map();
  const juntar = () => { S.itens = [...itensPor.values()].flat(); };
  db.collection('registros').onSnapshot(snap => {
    S.pessoas = snap.docs.map(d => ({uid:d.id, ...d.data()}));
    const ids = S.pessoas.map(p => p.uid);
    ids.forEach(uid => {
      if (subsItens.has(uid)) return;
      try { subsItens.set(uid, db.collection('registros/'+uid+'/itens').onSnapshot(q => { itensPor.set(uid, q.docs.map(d => ({...d.data(), id:d.id, _uid:uid}))); juntar(); render(); }, onErr)); } catch(_){}
    });
    for (const [uid, un] of subsItens) if (!ids.includes(uid)){ un(); subsItens.delete(uid); itensPor.delete(uid); }
    juntar(); regLoaded = true; render();
  }, e => { regLoaded = true; onErr(e); render(); });
  const timer = setTimeout(() => { if (loaded.size < COLS.length){ $('#sync').textContent = 'Sem conexão com os dados'; $('#sync').dataset.s = 'off'; $('#view').innerHTML = '<div class="empty">Não foi possível acessar os dados compartilhados agora. Verifique a conexão; a página continua tentando.</div>'; } }, 10000);
  COLS.forEach(c => db.collection(c).onSnapshot(s => {
    S[(c === 'tanques' || c === 'leituras') ? '_'+c : c] = s.docs.map(d => ({id:d.id, ...d.data()}));
    loaded.add(c);
    if (loaded.size === COLS.length){ clearTimeout(timer); marcarAoVivo(); }
    render();
  }, onErr));
}
/* Responsável de fábrica: só lê a própria pasta (registros/<id>), que o ADM preenche com os dados da fábrica dele */
let visao = null, visaoLoaded = false, opEstado = 'carregando';
function aplicarVisao(){
  if (!visao || !visao.fabricaId){ opEstado = 'aguardando'; return; }
  S.unidades = visao.fabrica ? [visao.fabrica] : [];
  S.gases = visao.gases || []; S._tanques = visao.tanques || []; S._leituras = visao.leituras || [];
  fab = visao.fabricaId; opEstado = 'ok';
}
function iniciarOp(){
  if (!meuId){ opEstado = 'semconta'; visaoLoaded = regLoaded = true; render(); return; }
  db.doc('registros/'+meuId).set({ultimoAcesso:new Date().toISOString()}).catch(() => { opEstado = 'semacesso'; visaoLoaded = regLoaded = true; render(); });
  const timer = setTimeout(() => { if (!visaoLoaded){ $('#sync').textContent = 'Sem conexão com os dados'; $('#sync').dataset.s = 'off'; } }, 10000);
  db.doc('registros/'+meuId+'/visao/dados').onSnapshot(s => {
    visao = s.exists ? s.data() : null; aplicarVisao(); visaoLoaded = true; clearTimeout(timer); marcarAoVivo(); render();
  }, e => { visaoLoaded = true; onErr(e); render(); });
  db.collection('registros/'+meuId+'/itens').onSnapshot(q => { S.itens = q.docs.map(d => ({...d.data(), id:d.id, _uid:meuId})); regLoaded = true; render(); }, e => { regLoaded = true; onErr(e); render(); });
  db.collection('registros/'+meuId+'/decisoes').onSnapshot(q => { S.aprovacoes = q.docs.map(d => ({...d.data(), id:meuId+'~'+d.id})); render(); }, onErr);
}
/* ADM: envia a cada responsável apenas os dados da fábrica dele */
const enviados = {}; let syncT = 0;
const DOMINIO_PADRAO = 'semeato.com.br';
const cfgUsuarios = () => byId('config','usuarios') || {};
const usuariosLista = () => cfgUsuarios().lista || [];
const dominio = () => (cfgUsuarios().dominio || DOMINIO_PADRAO).toLowerCase().replace(/^@/,'');
const emails = {};
const admLiberado = () => souDono || usuariosLista().some(x => x.papel === 'adm' && x.ativo !== false && meuEmail && (x.email||'').toLowerCase() === meuEmail);
const cadastroDe = uid => { const e = (emails[uid] || '').toLowerCase(); return e ? usuariosLista().find(x => (x.email||'').toLowerCase() === e) : null; };
function membros(){
  const out = {};
  for (const p of (S.pessoas || [])){ const u = cadastroDe(p.uid); if (u && u.papel !== 'adm' && u.ativo !== false && u.fabricaId) out[p.uid] = {fabricaId:u.fabricaId, nome:u.nome}; }
  return out;
}
function montarVisao(fid){
  const u = fid && byId('unidades', fid);
  if (!u) return {fabricaId:''};
  const tanques = S.tanques.filter(t => t.unidadeId === fid).map(t => ({id:t.id, gasId:t.gasId, unidadeId:t.unidadeId, codigo:t.codigo||'', uso:t.uso||'', parteAbastecimento:vazio(t.parteAbastecimento)?'':Number(t.parteAbastecimento), capacidade:t.capacidade||'', modelo:t.modelo||'', nivel:vazio(t.nivel)?'':Number(t.nivel), nivelPol:vazio(t.nivelPol)?'':Number(t.nivelPol), unidadeLeitura:t.unidadeLeitura||'', polCheio:vazio(t.polCheio)?'':Number(t.polCheio), tabelaPol:t.tabelaPol||'', ultimaLeitura:t.ultimaLeitura||'', fotoId:t.fotoId||'', exemplo:!!t.exemplo}));
  const ids = new Set(tanques.map(t => t.id));
  const gids = new Set(tanques.map(t => t.gasId).concat(S.usos.filter(x => x.unidadeId === fid).map(x => x.gasId)));
  const gases = S.gases.filter(g => gids.has(g.id)).map(g => ({id:g.id, nome:g.nome, medida:g.medida||''}));
  const leituras = S.leituras.filter(l => ids.has(l.tanqueId)).sort((a,b) => (b.data||'').localeCompare(a.data||'')).slice(0, 60)
    .map(l => ({id:String(l.id), tanqueId:l.tanqueId, nivel:vazio(l.nivel) ? '' : Number(l.nivel), nivelPol:vazio(l.nivelPol) ? '' : Number(l.nivelPol), data:l.data, fotoId:l.fotoId||'', exemplo:!!l.exemplo}));
  return {fabricaId:fid, fabrica:{id:u.id, nome:u.nome, icone:u.icone||''}, tanques, gases, leituras};
}
function agendarSync(){ clearTimeout(syncT); syncT = setTimeout(sincronizarVisoes, 1500); }
async function sincronizarVisoes(){ return; /* feito no servidor */
  if (papel !== 'adm' || !db || loaded.size < COLS.length) return;
  for (const p of (S.pessoas || [])){
    if (p.uid === meuId || !(p.uid in emails)) continue;
    const m = membros()[p.uid] || {}, cad = cadastroDe(p.uid);
    const payload = {...montarVisao(m.fabricaId || ''), horario: horarioCfg(), motivo: m.fabricaId ? '' : !emails[p.uid] ? 'semeemail' : !cad ? 'semcadastro' : cad.ativo === false ? 'desativado' : 'semfabrica', email: emails[p.uid] || ''};
    const js = JSON.stringify(payload);
    if (enviados[p.uid] === js) continue;
    try { await db.doc('registros/'+p.uid+'/visao/dados').set({...payload, atualizado:new Date().toISOString()}); enviados[p.uid] = js; } catch(_){}
  }
}
async function vincular(uid, fid){
  const atual = {...membros()};
  if (fid) atual[uid] = {fabricaId:fid}; else delete atual[uid];
  await db.collection('config').doc('equipe').set({membros:atual, exemplo:false});
  toast(fid ? pessoa(uid)+' agora responde pela '+nomeUni(fid) : 'Acesso de '+pessoa(uid)+' removido');
}
function vAguardando(){
  const msg = {
    aguardando: ({
      semcadastro:['Usuário não cadastrado','Seu e-mail'+(visao && visao.email ? ' ('+visao.email+')' : '')+' ainda não foi cadastrado pelo ADM. Peça ao ADM para cadastrar você e escolher a sua fábrica.'],
      semeemail:['Acesso só com e-mail da empresa','Esta conta não tem um e-mail da empresa. Entre com seu e-mail corporativo da Semeato.'],
      desativado:['Acesso desativado','Seu usuário foi desativado pelo ADM.'],
      semfabrica:['Sem fábrica definida','O ADM cadastrou você, mas ainda não escolheu a sua fábrica.'],
    })[visao && visao.motivo] || ['Aguardando liberação do ADM','Seu acesso foi registrado. O ADM precisa cadastrar seu e-mail e escolher a sua fábrica. Assim que isso acontecer, esta tela mostra os tanques da sua fábrica.'],
    semacesso:['Sua conta só pode visualizar','Para enviar leituras, peça ao ADM acesso de Colaborador neste app.'],
    semconta:['Entre com sua conta','Abra o app com sua conta da Semeato para enviar leituras.'],
  }[opEstado] || ['Carregando…',''];
  return '<section class="panel" style="max-width:560px;margin:40px auto">'+'<h2>'+msg[0]+'</h2><p class="muted" style="margin:0">'+msg[1]+'</p></section>';
}
function semDb(){
  $('#sync').textContent = 'Indisponível';
  $('#view').innerHTML = '<div class="banner red"><span>Os dados compartilhados não estão disponíveis nesta visualização. Verifique a conexão e entre novamente.</span></div>';
}
iniciar();
})();
</script>
